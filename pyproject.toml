[project]
name = "generative-recommenders"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.0.0",
    "jaxtyping>=0.3.10",
    "torch>=2.12.0",
    "tyro>=1.0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generative_recommenders"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-ignore = ["F722", "F821"]
